<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Transformations Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one study column; graph-paper header mark + session tally; five modes as tabs; grids drawn in SVG with preimage in ink and image in the worksheet's purple */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#17202A; --muted:#5B6672; --line:#D5DBE2;
  --accent:#2257C9; --accent-soft:#E2EAFA; --accent-ink:#FFFFFF;
  --img:#6D3FC0; --img-soft:#ECE4FA; --grid:#E3E8EE; --axis:#7D8794; --mirror:#D9480F;
  --good:#22713A; --good-soft:#E1F1E5; --bad:#B42318; --bad-soft:#FBE4E1;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#171D24; --sunk:#12171D; --ink:#E5E9EE; --muted:#9AA4B0; --line:#2A3440;
  --accent:#86A8F5; --accent-soft:#1B2740; --accent-ink:#0B1222;
  --img:#B497F2; --img-soft:#2A2140; --grid:#222B35; --axis:#6E7A88; --mirror:#F08A55;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#171D24; --sunk:#12171D; --ink:#E5E9EE; --muted:#9AA4B0; --line:#2A3440;
  --accent:#86A8F5; --accent-soft:#1B2740; --accent-ink:#0B1222;
  --img:#B497F2; --img-soft:#2A2140; --grid:#222B35; --axis:#6E7A88; --mirror:#F08A55;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none;width:50px;height:50px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(28px,6vw,38px);line-height:1.05}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.tally b{display:block;font-size:26px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

nav.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:16px 48px;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:grid;gap:14px;min-width:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.prompt{margin:0;font-size:clamp(19px,3.4vw,23px);line-height:1.4;font-weight:600;text-wrap:pretty}
.pts{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.pts span{white-space:nowrap}
.pts .im{color:var(--img);font-weight:600}
.rule-big{font-family:var(--mono);font-size:clamp(17px,3.2vw,21px);font-weight:600}
.inputs{display:grid;gap:8px}
.inrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.inrow label{font-family:var(--mono);font-weight:700;color:var(--img);min-width:2.6em}
.inrow .fix{grid-column:2;font-size:14px;font-weight:700;color:var(--bad);font-family:var(--mono)}
input[type=text]{width:100%;font:inherit;font-family:var(--mono);color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--good);background:var(--good-soft)} input.no{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
.btn[disabled]{opacity:.45;cursor:default}
button:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0}

.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.mc{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);font:600 16px var(--body);padding:12px 14px;border-radius:10px;cursor:pointer;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.mono span:last-child{font-family:var(--mono)}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.dim{opacity:.55}
.opt[disabled]{cursor:default}

.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--accent-soft)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)} .fb.info strong{color:var(--accent)}
.fb p{margin:0}
.work{font-family:var(--mono);font-size:14px;line-height:1.65;overflow-wrap:anywhere}

.gridbox{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;place-items:center}
.gridbox svg{width:100%;max-width:440px;height:auto;display:block;touch-action:manipulation}
.gridbox svg.click{cursor:crosshair}
svg .gl{stroke:var(--grid);stroke-width:.04}
svg .ax{stroke:var(--axis);stroke-width:.07}
svg .tn{fill:var(--muted);font-size:.5px;font-family:var(--mono)}
svg .pre{fill:none;stroke:var(--ink);stroke-width:.1;stroke-linejoin:round}
svg .preD{fill:var(--ink)}
svg .img{fill:var(--img-soft);fill-opacity:.55;stroke:var(--img);stroke-width:.1;stroke-linejoin:round}
svg .imgD{fill:var(--img)}
svg .ans{fill:none;stroke:var(--good);stroke-width:.08;stroke-dasharray:.25 .18}
svg .mirror{stroke:var(--mirror);stroke-width:.07;stroke-dasharray:.35 .2}
svg .lab{font-size:.62px;font-weight:700;font-family:var(--body)}
svg .lab.p{fill:var(--ink)} svg .lab.i{fill:var(--img)}
svg .ghost{fill:var(--img);opacity:.35}
svg .okD{fill:var(--good)} svg .noD{fill:var(--bad)}
svg .ctr{fill:var(--mirror)}
svg .mlab{fill:var(--mirror);font-size:.55px;font-weight:700;font-family:var(--mono)}
.placed{display:flex;flex-wrap:wrap;gap:6px}
.placed span{font-family:var(--mono);font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
.placed span.next{border-color:var(--img);color:var(--img);font-weight:700}

.symbox{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;place-items:center}
.symbox svg{width:100%;max-width:220px;height:auto}
.symbox .shp{fill:var(--img-soft);stroke:var(--img);stroke-width:.45;stroke-linejoin:round}
details.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sheet summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.sheet summary::-webkit-details-marker{display:none}
details.sheet summary::after{content:"Show";font-family:var(--mono);font-size:12px;color:var(--accent)}
details.sheet[open] summary::after{content:"Hide"}
.sheet-body{border-top:1px solid var(--line);padding:4px clamp(14px,3vw,22px) 10px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.rl:first-child{border-top:0}
.rl b{font-size:15px}
.rl code{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--img);white-space:nowrap}
.rl p{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted)}
@media (max-width:440px){.rl{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(3px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="wrap head">
    <div class="brand">
      <svg viewBox="0 0 50 50" aria-hidden="true">
        <rect x="1" y="1" width="48" height="48" rx="8" fill="var(--surface)" stroke="var(--line)"/>
        <path d="M9 10v30M17 10v30M33 10v30M41 10v30M9 10h32M9 18h32M9 26h32M9 34h32" stroke="var(--grid)" stroke-width="1"/>
        <line x1="25" y1="6" x2="25" y2="44" stroke="var(--mirror)" stroke-width="1.6" stroke-dasharray="3 2"/>
        <polygon points="9,34 21,30 17,14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="41,34 29,30 33,14" fill="var(--img-soft)" stroke="var(--img)" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="eyebrow">Geometry · Transformations, dilations &amp; symmetry</p>
        <h1>Transformations Lab</h1>
      </div>

  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Study modes">

  </nav>
</div>

<main class="wrap">
  <details class="sheet"><summary>My notes</summary><div class="sheet-body" id="sheet-body"></div></details>

  <section id="pane-mc" role="tabpanel" aria-labelledby="tab-mc">
    <div class="bar"><div class="chips" id="mc-filter"></div><span class="count" id="mc-count"></span></div>

  </section>
  <section id="pane-find" role="tabpanel" aria-labelledby="tab-find" hidden>

    <div id="find-card"></div>
  </section>

    <div class="bar"><div class="chips" id="graph-filter"></div><span class="count" id="graph-count"></span></div>
    <div id="graph-card"></div>
  </section>

</main>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v;do{v=ri(a,b);}while(v===0);return v;};
const store={get(k,d){try{const v=localStorage.getItem('xform:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('xform:'+k,JSON.stringify(v));}catch(e){}}};
const N=n=>n<0?'−'+Math.abs(n):String(n);              // pretty number
const P=p=>`(${N(p[0])}, ${N(p[1])})`;                         // pretty point
const V=(a,b)=>`⟨${N(a)}, ${N(b)}⟩`;                // pretty vector
const PN=n=>n<0?`(${N(n)})`:N(n);                               // number in parentheses if negative
const same=(p,q)=>p[0]===q[0]&&p[1]===q[1];
function parseNum(v){ const s=String(v).replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/^k=/i,''); let m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if(m) return +m[1]/+m[2]; m=s.match(/^-?\d*\.?\d+$/); return m?+s:null; }
function parsePt(s){ const m=String(s).replace(/[−–]/g,'-').match(/-?\d+(\.\d+)?/g); return m&&m.length===2?m.map(Number):null; }
let tally={right:0,total:0};
function score(ok){ tally.total++; if(ok) tally.right++; $('#tally').textContent=tally.right+' / '+tally.total; }

/* ---------- transformations ---------- */
const KINDS={
  tr:{name:'Translation'}, rx:{name:'x-axis'}, ry:{name:'y-axis'}, yx:{name:'y = x'}, nyx:{name:'y = −x'}, xh:{name:'x = h'}, yk:{name:'y = k'}, ro:{name:'Rotation (origin)'}, rp:{name:'Rotation (point)'}, dl:{name:'Dilation'}, cp:{name:'Composition'}
};
function makeT(kind){
  const t={kind};
  if(kind==='tr'){ t.a=nz(-5,5); t.b=Math.random()<.15?0:nz(-5,5); t.words=Math.random()<.35; }
  if(kind==='xh') t.h=nz(-4,4);
  if(kind==='yk') t.k=nz(-4,4);
  if(kind==='ro'||kind==='rp'){ t.deg=pick([90,90,180,270]); t.dir=pick(['cw','ccw']);
    if(kind==='ro') t.c=[0,0]; else { do{ t.c=[ri(-3,3),ri(-3,3)]; }while(t.c[0]===0&&t.c[1]===0); } }
  if(kind==='dl'){ const [n,d]=pick([[2,1],[3,1],[1,2],[1,3],[2,3],[3,4],[3,2],[5,2],[7,2],[5,4]]); t.sn=n; t.sd=d; }
  if(kind==='cp'){ const ks=['tr','rx','ry','yx','nyx','xh','yk','ro']; const k1=pick(ks); let k2; do{ k2=pick(ks); }while(k2===k1); t.f=makeT(k1); t.s=makeT(k2); t.f.words=false; t.s.words=false; }
  return t;
}
const FR=t=>t.sd===1?String(t.sn):`${t.sn}/${t.sd}`;
const kval=t=>t.sn/t.sd;
const r2=v=>Math.round(v*100)/100;
const effCCW=t=>(t.dir==='ccw'||t.deg===180)?t.deg:(360-t.deg)%360;
function rotO(e,p){ const [x,y]=p; return e===90?[-y,x]:e===180?[-x,-y]:[y,-x]; }
const ORULE={90:'(x, y) → (−y, x)',180:'(x, y) → (−x, −y)',270:'(x, y) → (y, −x)'};
const isRot=t=>t.kind==='ro'||t.kind==='rp';
const cat=t=>t.kind==='tr'?'tr':t.kind==='dl'?'dl':t.kind==='cp'?'cp':isRot(t)?'rot':'ref';
function ctrText(t){ return (t.c[0]===0&&t.c[1]===0)?'the origin':`the point ${P(t.c)}`; }
function apply(t,p){ const [x,y]=p;
  if(isRot(t)){ const r=rotO(effCCW(t),[x-t.c[0],y-t.c[1]]); return [r[0]+t.c[0],r[1]+t.c[1]]; }
  if(t.kind==='dl') return [r2(x*t.sn/t.sd),r2(y*t.sn/t.sd)];
  if(t.kind==='cp') return apply(t.s,apply(t.f,p));
  switch(t.kind){
    case 'tr': return [x+t.a,y+t.b];
    case 'rx': return [x,-y];
    case 'ry': return [-x,y];
    case 'yx': return [y,x];
    case 'nyx': return [-y,-x];
    case 'xh': return [2*t.h-x,y];
    case 'yk': return [x,2*t.k-y];
  }
}
function moveWords(a,b){ const parts=[]; if(a) parts.push(`${Math.abs(a)} unit${Math.abs(a)===1?'':'s'} ${a<0?'left':'right'}`); if(b) parts.push(`${Math.abs(b)} unit${Math.abs(b)===1?'':'s'} ${b<0?'down':'up'}`); return parts.join(' and ')||'0 units'; }
function describe(t){
  switch(t.kind){
    case 'tr': return t.words?`translation ${moveWords(t.a,t.b)}`:`translation ${V(t.a,t.b)}`;
    case 'rx': return 'reflection across the x-axis';
    case 'ry': return 'reflection across the y-axis';
    case 'yx': return 'reflection across y = x';
    case 'nyx': return 'reflection across y = −x';
    case 'xh': return `reflection across x = ${N(t.h)}`;
    case 'yk': return `reflection across y = ${N(t.k)}`;
    case 'ro': case 'rp': return `rotation ${t.deg}°${t.deg===180?'':' '+(t.dir==='cw'?'clockwise':'counterclockwise')} about ${ctrText(t)}`;
    case 'dl': return `dilation by a scale factor of ${FR(t)} (center at the origin)`;
    case 'cp': return `${describe(t.f)}, followed by a ${describe(t.s)}`;
  }
}
const sg=(v,n)=>n===0?v:`${v} ${n<0?'−':'+'} ${Math.abs(n)}`;
function ruleOf(t,generic){
  switch(t.kind){
    case 'tr': return generic?'(x, y) → (x + a, y + b)':`(x, y) → (${sg('x',t.a)}, ${sg('y',t.b)})`;
    case 'rx': return '(x, y) → (x, −y)';
    case 'ry': return '(x, y) → (−x, y)';
    case 'yx': return '(x, y) → (y, x)';
    case 'nyx': return '(x, y) → (−y, −x)';
    case 'xh': return generic?'(x, y) → (2h − x, y)':`(x, y) → (2(${N(t.h)}) − x, y)`;
    case 'yk': return generic?'(x, y) → (x, 2k − y)':`(x, y) → (x, 2(${N(t.k)}) − y)`;
    case 'ro': case 'rp': return ORULE[effCCW(t)];
    case 'dl': return generic?'(x, y) → (kx, ky)':`(x, y) → (${FR(t)}x, ${FR(t)}y)`;
    case 'cp': return 'do the first, then the second';
  }
}
function work(t,p,lab){
  const [x,y]=p, q=apply(t,p), L=lab?esc(lab):'', L2=lab?esc(lab)+'′':'';
  switch(t.kind){
    case 'tr': return `${L}${P(p)} → (${N(x)} + ${PN(t.a)}, ${N(y)} + ${PN(t.b)}) = ${L2}${P(q)}`;
    case 'xh': return `${L}${P(p)} → (2(${N(t.h)}) − ${PN(x)}, ${N(y)}) = ${L2}${P(q)}`;

/* ---------- rule expression checker (for typed rules) ---------- */
function compileRule(str){
  let s=String(str).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'');
  s=s.replace(/^\(x,y\)(->|→|=>|to)?/,'');
  if(s.startsWith('(')&&s.endsWith(')')) s=s.slice(1,-1);
  let depth=0, cut=-1;
  for(let i=0;i<s.length;i++){ const c=s[i]; if(c==='(') depth++; else if(c===')') depth--; else if(c===','&&depth===0){ if(cut>=0) return null; cut=i; } }
  if(cut<0) return null;
  const parts=[s.slice(0,cut),s.slice(cut+1)];
  try{
    return parts.map(p=>{
      if(!p||!/^[0-9xyhkab+\-*().]+$/.test(p)) throw 0;
      let e=p.replace(/(\d|\))(?=[xyhkab(])/g,'$1*').replace(/([xyhkab])(?=[\d(xyhkab])/g,'$1*').replace(/--/g,'+').replace(/\+-/g,'-').replace(/-\+/g,'-');
      const f=new Function('x','y','h','k','a','b','"use strict";return ('+e+');'); f(1,2,3,4,5,6); return f;
    });
  }catch(e){ return null; }
}
function ruleMatches(str, truth){
  const f=compileRule(str); if(!f) return false;
  for(let i=0;i<6;i++){ const v=[ri(-9,9),ri(-9,9),ri(-9,9),ri(-9,9),ri(-9,9),ri(-9,9)];
    const want=truth(...v); if(Math.abs(f[0](...v)-want[0])>1e-9||Math.abs(f[1](...v)-want[1])>1e-9) return false; }
  return true;
}
/* parse a named transformation: a line or a vector */
function parseNamed(str){
  const raw=String(str).toLowerCase();
  const rm=raw.match(/(90|180|270)/);
  if(rm&&!raw.includes('=')){ const deg=+rm[1]; const ccw=/counter|ccw|anti/.test(raw), cw=!ccw&&/clock|cw/.test(raw);
    if(deg!==180&&!ccw&&!cw) return null; return {kind:'ro',deg,dir:ccw?'ccw':'cw',c:[0,0]}; }
  let s=String(str).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/^(reflection|reflect)?(across|over)?(the)?(line)?/,'');
  if(/^x-?axis$/.test(s)||s==='y=0') return {kind:'rx'};
  if(/^y-?axis$/.test(s)||s==='x=0') return {kind:'ry'};
  if(s==='y=x') return {kind:'yx'};
  if(s==='y=-x') return {kind:'nyx'};
  let m=s.match(/^x=(-?\d+)$/); if(m) return {kind:'xh',h:+m[1]};
  m=s.match(/^y=(-?\d+)$/); if(m) return {kind:'yk',k:+m[1]};
  if(!s.includes('=')){ const p=parsePt(s); if(p) return {kind:'tr',a:p[0],b:p[1]}; }
  return null;
}

/* ---------- generic engine ---------- */
function makeEngine(id, gen, opts={}){
  const E={queue:[],cur:null,state:'ask',right:0,total:0,picked:null,typed:[],res:null};
  const next=re=>{ if(re&&E.cur) E.queue.splice(Math.min(3,E.queue.length),0,{...E.cur,retry:true});
    if(!E.queue.length){ if(opts.fixed){ E.cur=null; render(); return; } E.queue=gen(); }
    E.cur=E.queue.shift(); E.state='ask'; E.picked=null; E.typed=[]; E.res=null; render(); };
  function finish(ok){ E.total++; if(ok) E.right++; score(ok); E.state=ok?'right':'wrong'; E.miss=!ok; render(); }
  function render(){
    const q=E.cur, el=$('#'+id+'-card');
    $('#'+id+'-count').textContent=opts.fixed?`${E.right} / ${E.total} correct · ${E.queue.length+(q?1:0)} left`:`${E.right} / ${E.total} correct`;
    if(!q){ el.innerHTML=`<div class="card"><p class="label">Deck done</p><p class="prompt">${E.right} of ${E.total} correct, counting retries.</p><div class="row"><button class="btn primary" id="${id}-again">Shuffle and go again</button></div></div>`;
      $('#'+id+'-again').onclick=()=>{ E.right=0; E.total=0; E.queue=gen(); next(); }; return; }
    const st=E.state;
    const fb=st==='ask'?'':`<div class="fb ${st==='right'?'ok':'no'}"><strong>${st==='right'?'Correct.':'Not quite. You’ll get this one again in a few questions.'}</strong>${q.why?`<div class="work">${q.why}</div>`:''}</div>`;
    let body='';
    if(q.choices){
      body=`<div class="mc">${q.choices.map((c,i)=>{ let cls=q.mono?'mono ':''; if(st!=='ask'){ cls+=c===q.answer?'ok':c===E.picked?'no':'dim'; }
        return `<button class="opt ${cls}" data-i="${i}" ${st!=='ask'?'disabled':''}><span class="k">${i+1}</span><span>${esc(c)}</span></button>`; }).join('')}</div>`;
    } else {

        return `<div class="inrow"><label for="${id}-in${i}">${esc(inp.label)}</label><input type="text" id="${id}-in${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(inp.ph||'')}" ${st!=='ask'?'readonly':''} value="${esc(E.typed[i]||'')}" class="${r===true?'ok':r===false?'no':''}">${r===false&&inp.show?`<span class="fix">${esc(inp.show)}</span>`:''}</div>`; }).join('')}</div>`;
    }
    const actions = st==='ask' ? (q.choices?'<span class="kbd">Press 1–4</span>':`<button class="btn primary" id="${id}-check">Check</button><button class="btn ghost" id="${id}-idk">Show me</button><span class="kbd">Enter</span>`)
      : `<button class="btn primary" id="${id}-next">Next</button><span class="kbd">Enter</span>`;
    el.innerHTML=`<div class="card"><p class="label">${esc(q.label)}${q.retry?' · try again':''}</p><div class="prompt">${q.prompt}</div>${q.visual||''}${body}${fb}<div class="row">${actions}</div></div>`;
    if(q.choices){
      if(st==='ask') el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ E.picked=q.choices[+b.dataset.i]; finish(E.picked===q.answer); });
    } else if(st==='ask'){
      const ins=[...el.querySelectorAll('input[type=text]')];
      const check=reveal=>{ E.typed=ins.map(i=>i.value);
        if(!reveal&&E.typed.some(v=>!v.trim())){ ins.find(i=>!i.value.trim()).focus(); return; }
        E.res=q.inputs.map((inp,i)=>reveal?false:inp.check(E.typed[i])); finish(E.res.every(Boolean)); };

    }

  }
  return {start(){ E.right=0; E.total=0; E.queue=gen(); next(); }, key(e){ const q=E.cur; if(q&&q.choices&&E.state==='ask'&&/^[1-4]$/.test(e.key)){ const b=document.querySelector(`#${id}-card .opt[data-i="${+e.key-1}"]`); if(b) b.click(); } }};
}

const ALLRULES=['(x, y) → (x, −y)','(x, y) → (−x, y)','(x, y) → (y, x)','(x, y) → (−y, −x)','(x, y) → (2h − x, y)','(x, y) → (x, 2k − y)','(x, y) → (−x, −y)','(x, y) → (x + a, y + b)','(x, y) → (y, −x)','(x, y) → (−y, x)'];
function mcImage(kinds){
  const t=makeT(pick(kinds)); let p; do{ p=[nz(-6,6),nz(-6,6)]; }while(same(apply(t,p),p));
  const right=P(apply(t,p));
  const q=apply(t,p), wset=new Set(wrongImages(t,p).map(P)); wset.delete(right);
  while(wset.size<3){ const w=P([q[0]+ri(-2,2),q[1]+ri(-2,2)]); if(w!==right) wset.add(w); }
  const wrong=[...wset];
  return {label:'Find the image', prompt:`What is the image of P${esc(P(p))} after a ${esc(describe(t))}?`, choices:shuffle([right,...shuffle(wrong).slice(0,3)]), answer:right, mono:true,
    why:`${esc(ruleLine(t))}<br>${work(t,p,'P')}`};
}
function mcRule(kinds){
  if(kinds.some(k=>k==='ro'||k==='rp')&&(kinds.every(k=>k==='ro'||k==='rp')||Math.random()<.35)){
    const opts=[[90,'cw'],[90,'ccw'],[180,'cw'],[270,'cw'],[270,'ccw']]; const [deg,dir]=pick(opts); const t={kind:'ro',deg,dir,c:[0,0]};
    const right=ORULE[effCCW(t)];
    return {label:'Rules', prompt:`Which rule is a ${esc(describe(t))}?`, choices:shuffle([right,...shuffle(ALLRULES.filter(r=>r!==right)).slice(0,3)]), answer:right, mono:true,
      why:t.deg===270?esc(ruleLine(t)):''}; }
  const k=pick(kinds.filter(x=>x!=='tr').length?kinds.filter(x=>x!=='tr'):['rx','ry','yx','nyx','xh','yk']); const t={kind:k};
  const right=ruleOf(t,true);
  const nm={rx:'the x-axis',ry:'the y-axis',yx:'y = x',nyx:'y = −x',xh:'a vertical line x = h',yk:'a horizontal line y = k'}[k];
  return {label:'Rules', prompt:`Which rule is a reflection across ${esc(nm)}?`, choices:shuffle([right,...shuffle(ALLRULES.filter(r=>r!==right)).slice(0,3)]), answer:right, mono:true};
}
function mcWhich(kinds){
  const t=makeT(pick(kinds)); if(t.kind==='cp') return mcImage(kinds); t.words=false; const s=makeShape(3,-5,5,t); if(!s) return mcImage(kinds);
  const right=describe(t);
  const others=new Set();
  const cand=[{kind:'rx'},{kind:'ry'},{kind:'yx'},{kind:'nyx'},{kind:'xh',h:t.h||nz(-3,3)},{kind:'yk',k:t.k||nz(-3,3)},{kind:'xh',h:-(t.h||2)},{kind:'yk',k:-(t.k||2)}];
  if(t.kind==='tr') cand.push({kind:'tr',a:-t.a,b:-t.b},{kind:'tr',a:t.b,b:t.a},{kind:'tr',a:t.a,b:-t.b});
  if(t.kind==='dl') [[2,1],[3,1],[1,2],[1,3],[3,4],[4,3]].forEach(([n,d])=>cand.push({kind:'dl',sn:n,sd:d}));
  if(isRot(t)){ [[90,'cw'],[90,'ccw'],[180,'cw']].forEach(([deg,dir])=>{ cand.push({kind:t.kind,deg,dir,c:t.c}); if(t.kind==='rp') cand.push({kind:'ro',deg,dir,c:[0,0]}); }); }
  else cand.push({kind:'ro',deg:90,dir:'cw',c:[0,0]},{kind:'ro',deg:90,dir:'ccw',c:[0,0]},{kind:'ro',deg:180,dir:'cw',c:[0,0]});
  shuffle(cand).forEach(c=>{ const d=describe(c); if(d!==right && !s.pts.every((p,i)=>same(apply(c,p),s.img[i]))) others.add(d); });
  const list=s.names.map((n,i)=>`<span>${n}${P(s.pts[i])}</span><span class="im">→ ${n}′${P(s.img[i])}</span>`).join('');
  return {label:'Name the transformation', prompt:`Which transformation maps the figure to its image?<div class="pts" style="margin-top:8px">${list}</div>`,
    visual:gridSVG({shapes:[{pts:s.pts,names:s.names,cls:'pre'},{pts:s.img,names:s.names,cls:'img',prime:true}]}),
    choices:shuffle([right,...[...others].slice(0,3)]), answer:right, why:`${esc(ruleLine(t))}<br>${s.names.map((n,i)=>work(t,s.pts[i],n)).join('<br>')}`};
}
function mcConcept(){ const [q,a,w]=pick(Math.random()<.3?SYMCON:CONCEPTS); return {label:'Concepts', prompt:esc(q), choices:shuffle([a,...w]), answer:a}; }

const graphF=filterChips('graph-filter',KF,'graphF',()=>newGraph());
const G={q:null,placed:[],state:'ask',right:0,total:0};
function newGraph(retry){
  if(retry&&G.q){ G.q.retry=true; } else {
    let s,t; do{ t=makeT(pick(kindsFor(graphF()))); s=makeShape(3,-6,6,t); }while(!s);

function renderGraph(){
  const {t,s}=G.q, el=$('#graph-card'), done=G.state!=='ask';
  $('#graph-count').textContent=`${G.right} / ${G.total} correct`;
  const shapes=[{pts:s.pts,names:s.names,cls:'pre'}];
  if(done) shapes.push({pts:s.img,names:s.names,cls:'ans',dot:'okD',prime:true});
  let extra='';
  if(G.placed.length){
    if(G.placed.length>=2) extra+=`<polygon class="img" points="${G.placed.map(p=>`${p[0]},${-p[1]}`).join(' ')}" ${G.placed.length<3?'style="fill:none"':''}/>`;
    G.placed.forEach((p,i)=>{ const ok=same(p,s.img[i]); extra+=`<circle class="${done?(ok?'okD':'noD'):'imgD'}" cx="${p[0]}" cy="${-p[1]}" r="0.2"/>${done?'':`<text class="lab i" x="${p[0]+0.22}" y="${-p[1]-0.24}">${s.names[i]}′</text>`}`; });
  }
  extra+='<circle class="ghost" id="ghost" r="0.2" cx="-99" cy="-99"/>';

  const fb=!done?'':(()=>{ const ok=G.state==='right';
    return `<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Correct. All three points are in the right place.':'Not quite. The dashed green shape is the correct image.'}</strong><div class="work">${esc(ruleLine(t))}<br>${s.names.map((n,i)=>work(t,s.pts[i],n)+(G.placed[i]&&!same(G.placed[i],s.img[i])?` <span style="color:var(--bad)">(you put ${P(G.placed[i])})</span>`:'')).join('<br>')}</div></div>`; })();
  el.innerHTML=`<div class="card"><p class="label">Graph the image${G.q.retry?' · try again':''}</p>
    <div class="prompt">${esc(describe(t)).replace(/^./,c=>c.toUpperCase())}<div class="pts" style="margin-top:8px">${s.names.map((n,i)=>`<span>${n}${P(s.pts[i])}</span>`).join('')}</div></div>
    ${gridSVG({shapes,mirror,id:'gsvg',click:!done,extra})}
    <div class="placed">${s.names.map((n,i)=>`<span class="${!done&&i===G.placed.length?'next':''}">${n}′ ${G.placed[i]?P(G.placed[i]):'tap the grid'}</span>`).join('')}</div>
    ${fb}
    <div class="row">${done?'<button class="btn primary" id="g-next">Next</button>':`<button class="btn primary" id="g-check" ${G.placed.length<3?'disabled':''}>Check</button><button class="btn" id="g-undo" ${G.placed.length?'':'disabled'}>Undo</button><button class="btn ghost" id="g-show">Show me</button>`}${!done&&nextName?`<span class="kbd">Tap where ${nextName} goes</span>`:''}</div></div>`;
  const svg=$('#gsvg');
  if(!done){
    const toPt=e=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); return [Math.max(-8,Math.min(8,Math.round(p.x))),Math.max(-8,Math.min(8,Math.round(-p.y)))]; };

    svg.addEventListener('pointerleave',()=>{ const gh=$('#ghost'); gh.setAttribute('cx',-99); });

  } else { const b=$('#g-next'); b.onclick=()=>newGraph(G.state==='wrong'&&!G.q.retry); b.focus(); }
}

 {n:'Letter T',L:1,O:1,svg:poly([[-7.5,-8],[7.5,-8],[7.5,-4],[2,-4],[2,8.5],[-2,8.5],[-2,-4],[-7.5,-4]]),lw:'one vertical line down the middle'},
 {n:'Letter E',L:1,O:1,svg:poly([[-6,-8],[6,-8],[6,-5],[-2,-5],[-2,-1.5],[4,-1.5],[4,1.5],[-2,1.5],[-2,5],[6,5],[6,8],[-6,8]]),lw:'one horizontal line through the middle'},
 {n:'Plus sign',L:4,O:4,svg:poly([[-2,-8.5],[2,-8.5],[2,-2],[8.5,-2],[8.5,2],[2,2],[2,8.5],[-2,8.5],[-2,2],[-8.5,2],[-8.5,-2],[-2,-2]]),lw:'vertical, horizontal, and both diagonals'},
 {n:'3-blade pinwheel',L:0,O:3,svg:[0,120,240].map(d=>poly(rotPts([[0,0],[9,0],[6.5,4.2]],d))).join(''),lw:''},
 {n:'4-blade pinwheel',L:0,O:4,svg:[0,90,180,270].map(d=>poly(rotPts([[0,0],[8.8,0],[6,4]],d))).join(''),lw:''},
 {n:'5-point star',L:5,O:5,svg:poly(Array.from({length:10},(_,i)=>{const a=(-90+36*i)*Math.PI/180,r=i%2?3.8:9.2;return [r*Math.cos(a),r*Math.sin(a)];})),lw:'one through each point'},
 {n:'Hourglass',L:2,O:2,svg:'<path class="shp" d="M-6,-8.5 H6 Q1.2,-2 1.2,0 Q1.2,2 6,8.5 H-6 Q-1.2,2 -1.2,0 Q-1.2,-2 -6,-8.5 Z"/>',lw:'one vertical, one horizontal'},
 {n:'Four-leaf shape',L:4,O:4,svg:[[0,-4.3],[4.3,0],[0,4.3],[-4.3,0]].map(([x,y])=>`<circle class="shp" cx="${x}" cy="${y}" r="4.4"/>`).join('')+'<circle cx="0" cy="0" r="3.2" style="fill:var(--img-soft);stroke:none"/>',lw:'vertical, horizontal, and both diagonals'},
];
const symBox=sh=>`<div class="symbox"><svg viewBox="-10.5 -10.5 21 21" role="img" aria-label="${esc(sh.n)}">${sh.svg}</svg></div>`;
const ptSym=sh=>sh.O%2===0;
function symWhy(sh){ const o=sh.O;
  return `${esc(sh.n)}: ${sh.L} line${sh.L===1?'':'s'} of symmetry${sh.lw?' ('+esc(sh.lw)+')':''}. `+
    (o===1?'It only matches itself after a full 360° turn, so it has <b>no rotational symmetry</b> and no point symmetry.':
    `It matches itself ${o} times in a full turn: order ${o}, magnitude 360° ÷ ${o} = ${360/o}°. `+(ptSym(sh)?'The order is even, so a 180° turn works: <b>it has point symmetry</b>.':'The order is odd, so 180° doesn’t work: <b>no point symmetry</b>.')); }
const isNo=v=>/^(no|none|n\/a|na|-|0|nope)$/i.test(String(v).trim());
const isYes=v=>/^(yes|y|yeah|yep)$/i.test(String(v).trim());
const numOf=v=>{ const m=String(v).match(/-?\d+(\.\d+)?/); return m?+m[0]:null; };
function symRow(){ const sh=pick(SHAPES), o=sh.O;
  return {label:'Fill the table row', prompt:`Fill in the symmetry row for this shape. <span class="tip">Type “none” if it has no rotational symmetry.</span>`, visual:symBox(sh),
    inputs:[
      {label:'Lines', ph:'number of lines', show:String(sh.L), check:v=>sh.L===0?(isNo(v)||numOf(v)===0):numOf(v)===sh.L},
      {label:'Order', ph:'order or none', show:o===1?'none (order 1)':String(o), check:v=>o===1?(isNo(v)||numOf(v)===1):numOf(v)===o},
      {label:'Angle', ph:'magnitude in °', show:o===1?'none':360/o+'°', check:v=>o===1?(isNo(v)||numOf(v)===360):numOf(v)===360/o},
      {label:'Point', ph:'yes or no', show:ptSym(sh)?'yes':'no', check:v=>ptSym(sh)?isYes(v):/^(no|n|nope)$/i.test(String(v).trim())}],
    why:symWhy(sh)}; }
function symLines(){ const sh=pick(SHAPES); const right=String(sh.L); const opts=new Set([right]); for(const c of ['0','1','2','3','4','5','6','8']){ if(opts.size>=4) break; if(Math.random()<.6) opts.add(c); } ['0','1','2','4'].forEach(c=>{ if(opts.size<4) opts.add(c); });
  return {label:'Lines of symmetry', prompt:'How many lines of symmetry does this shape have?', visual:symBox(sh), choices:shuffle([...opts].slice(0,4)), answer:right, why:symWhy(sh)}; }
function symRot(){ const sh=pick(SHAPES), o=sh.O; const right=o===1?'No rotational symmetry':`Order ${o}, magnitude ${360/o}°`;
  const pool=['No rotational symmetry','Order 2, magnitude 180°','Order 3, magnitude 120°','Order 4, magnitude 90°','Order 5, magnitude 72°','Order 6, magnitude 60°','Order 8, magnitude 45°','Order 2, magnitude 90°','Order 4, magnitude 45°'].filter(x=>x!==right);
  return {label:'Rotational symmetry', prompt:'Describe this shape’s rotational symmetry.', visual:symBox(sh), choices:shuffle([right,...shuffle(pool).slice(0,3)]), answer:right, why:symWhy(sh)}; }
function symPoint(){ const sh=pick(SHAPES); const right=ptSym(sh)?'Yes':'No';
  return {label:'Point symmetry', prompt:'Does this shape have point symmetry?', visual:symBox(sh), choices:['Yes','No'], answer:right, why:symWhy(sh)}; }
function symDef(){ const [q,a,w]=pick(SYMCON); return {label:'Definitions', prompt:esc(q), choices:shuffle([a,...w]), answer:a}; }
function symCalc(){ const r=Math.random();
  if(r<.5){ const o=pick([2,3,4,5,6,8,9,10,12]); return {label:'Order & magnitude', prompt:`A shape has rotational symmetry of order ${o}. What is its magnitude?`, inputs:[{label:'°', ph:'degrees', show:360/o+'°', check:v=>numOf(v)===360/o}], why:`360° ÷ ${o} = ${360/o}°`}; }
  const o=pick([2,3,4,5,6,8,9,10,12]); return {label:'Order & magnitude', prompt:`A shape has a magnitude of ${360/o}°. What is its order?`, inputs:[{label:'order', ph:'order', show:String(o), check:v=>numOf(v)===o}], why:`360° ÷ ${360/o}° = ${o}`}; }
const SYMDEFS=[
 ['Symmetry','A figure has symmetry if a reflection or rotation maps it exactly onto itself.'],
 ['Line symmetry (reflectional symmetry)','A line can be drawn so that each half is a mirror image of the other. If you fold the figure on that line, the halves match up exactly.'],
 ['Line of symmetry','The mirror line that splits a figure into two matching halves. A figure can have 0, 1, several, or (for a circle) infinitely many.'],
 ['Rotational symmetry','The figure looks exactly the same after a rotation of less than 360° about its center.'],
 ['Center of symmetry','The point the figure is turned around, usually its center.'],
 ['Order of symmetry','The number of times the figure maps onto itself during one full 360° turn. Order 1 means it only matches at 360°, so it has NO rotational symmetry.'],
 ['Magnitude (angle) of symmetry','The smallest angle you can turn the figure so it maps onto itself. Magnitude = 360° ÷ order.'],
 ['Point symmetry','The figure looks the same after a 180° turn (upside down). Every point has a matching point the same distance from the center on the opposite side. Any shape with an even order has point symmetry.'],
 ['Regular polygon shortcut','A regular polygon with n sides has n lines of symmetry, order n, and magnitude 360° ÷ n. It has point symmetry only if n is even.'],
 ['Circle','Infinitely many lines of symmetry, and it matches itself at every angle.'],
];
$('#sym-defs').innerHTML=SYMDEFS.map(([a,b])=>`<div class="rl"><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join('');
const symF=filterChips('sym-filter',{mix:'Mixed',row:'Fill the table',lines:'Lines',rot:'Rotational',point:'Point',defs:'Definitions'},'symF',()=>SYM.start());
const SYM=makeEngine('sym',()=>{ const f=symF(), G={row:symRow,lines:symLines,rot:symRot,point:symPoint,defs:symDef,calc:symCalc};
  const keys=f==='mix'?['row','row','lines','rot','point','defs','calc']:f==='rot'?['rot','rot','calc']:[f];
  return Array.from({length:10},()=>G[pick(keys)]()); });

/* ---------- tabs + boot ---------- */
const TABS=['mc','find','graph','name','sym','rules'];
function showTab(t){ TABS.forEach(x=>{ $('#pane-'+x).hidden=x!==t; $('#tab-'+x).setAttribute('aria-selected',x===t); }); store.set('tab',t);
  const inp=document.querySelector('#pane-'+t+' input[type=text]:not([readonly])'); if(inp) inp.focus(); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener('keydown',e=>{ if(e.target.matches('input')) return; if(!$('#pane-mc').hidden) MC.key(e); if(!$('#pane-sym').hidden) SYM.key(e);
  if(e.key==='Enter'&&!$('#pane-graph').hidden&&$('#g-next')&&document.activeElement!==$('#g-next')){ e.preventDefault(); $('#g-next').click(); } });
MC.start(); FIND.start(); NAME.start(); RULES.start(); SYM.start(); newGraph();
const t0=store.get('tab','mc'); showTab(TABS.includes(t0)?t0:'mc');
</script>
